name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SemVer tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          printf '%s' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ github.ref_name }}
        run: |
          go build -trimpath -ldflags="-s -w -buildid= -X github.com/infoe-labs/infoe-bots/cli.Version=$VERSION" -o infoe-bots-linux-amd64 .
          sha256sum infoe-bots-linux-amd64 > infoe-bots-linux-amd64.sha256

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: infoe-bots-linux-amd64

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            infoe-bots-linux-amd64 \
            infoe-bots-linux-amd64.sha256 \
            --verify-tag \
            --title "$VERSION" \
            --generate-notes
